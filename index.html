<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7285">
<title>여행 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { --bg:#edf2f3; --surface:#fff; --ink:#0f2a31; --muted:#587078; --line:#d3dee1; --accent:#0b7285; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b171b; --surface:#13242a; --ink:#e6f0f2; --muted:#8fa8af; --line:#24383f; --accent:#4cc3d6; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; font-size:15px; line-height:1.6; }
.wrap { max-width:640px; margin-inline:auto; padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 48px; }
h1 { font-family:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif; font-weight:800; font-size:24px; margin:0 0 16px; }
ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
a.trip { display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; color:inherit; text-decoration:none; }
a.trip b { display:block; font-size:17px; }
a.trip span { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
a.trip i { font-style:normal; color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<main class="wrap">
  <h1>여행 노트</h1>
  <ul>
    <li><a class="trip" href="2026sydney/"><div><b>🐨 시드니</b><span>2026.12.29 – 2027.01.16 · 장 · 아내 · 윤</span></div><i>→</i></a></li>
  </ul>
</main>
</body>
</html>
