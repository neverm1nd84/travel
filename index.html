:root {

  --accent-soft: #d9eef2;
  --on-accent: #ffffff;
  --sun: #b9770e;
  --sun-soft: #fbeccd;
  --rel: #2f7d4b;
  --rel-soft: #dcefe2;
  --air: #5a6b78;
  --air-soft: #e3e9ed;
  --font-display: "Bricolage Grotesque", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b171b; --surface: #13242a; --ink: #e6f0f2; --muted: #8fa8af; --line: #24383f;
    --accent: #4cc3d6; --accent-soft: #14343b; --on-accent: #06242a;
    --sun: #f0b73e; --sun-soft: #3a2f12; --rel: #6cc08a; --rel-soft: #17301f;
    --air: #9fb2bf; --air-soft: #1d2d36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b171b; --surface: #13242a; --ink: #e6f0f2; --muted: #8fa8af; --line: #24383f;
  --accent: #4cc3d6; --accent-soft: #14343b; --on-accent: #06242a;
  --sun: #f0b73e; --sun-soft: #3a2f12; --rel: #6cc08a; --rel-soft: #17301f;
  --air: #9fb2bf; --air-soft: #1d2d36; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin-inline: auto; padding-inline: 16px; padding-block: 0 48px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px 0; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

.sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }

button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding: 14px 16px 10px; margin-inline: -16px; scroll-snap-type: x proximity; scrollbar-width: none; }
.chip { flex: 0 0 auto; width: 52px; scroll-snap-align: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 0 7px; font: inherit; text-align: center; cursor: pointer; position: relative; overflow: hidden; }
.chip::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c, var(--accent)); }
.chip .d { display: block; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
.chip .w { display: block; font-size: 11px; color: var(--muted); }
.chip .m { display: block; font-size: 10px; color: var(--muted); line-height: 1; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .w, .chip[aria-pressed="true"] .m { color: var(--bg); opacity: .75; }
.chip.today { box-shadow: 0 0 0 2px var(--sun); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.day { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
.day-head { display: flex; flex-direction: column; gap: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }

.badge.rel { background: var(--rel-soft); color: var(--rel); }
.badge.air { background: var(--air-soft); color: var(--air); }
.badge.sun { background: var(--sun-soft); color: var(--sun); }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.date-line { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.lead { margin: 0; color: var(--muted); }

section.block { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.item > div { min-width: 0; }
.item b { display: block; font-weight: 700; }
.item span.desc { color: var(--muted); font-size: 14px; display: block; }
.map { flex: 0 0 auto; font-size: 12px; font-weight: 700; text-decoration: none; border: 1px solid var(--accent); border-radius: 99px; padding: 3px 11px; color: var(--accent); white-space: nowrap; }
.meal { border-left: 4px solid var(--sun); }
.tipbox { background: var(--sun-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.tipbox b { color: var(--sun); }
.pager { display: flex; gap: 10px; }
.pager button { flex: 1; font: inherit; font-weight: 700; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.pager button:disabled { opacity: .35; cursor: default; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 0; }
.kv { display: grid; grid-template-columns: 74px 1fr; gap: 2px 10px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.copy { font: inherit; font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-radius: 99px; background: none; color: var(--ink); padding: 2px 10px; cursor: pointer; margin-left: 6px; }
.seg { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; padding: 5px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fine { color: var(--muted); font-size: 12px; margin-top: 20px; }
.empty-note { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .day { animation: fade .18s ease-out; } }
@keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>

        { n: "공항으로 이동", d: "Circular Quay 또는 Central에서 Airport Line을 타고 International Airport 역에서 하차. 늦어도 18:30에 공항에 도착.", q: "Sydney International Airport Station" }
      ],
      lunch: [
        { n: "Din Tai Fung (World Square)", d: "마지막 점심. 만두와 볶음밥.", q: "Din Tai Fung World Square Sydney" },
        { n: "Bourke Street Bakery", d: "공항 가기 전 간식과 빵.", q: "Bourke Street Bakery Surry Hills" }
      ],
      dinner: [
        { n: "공항 식당", d: "출국 심사 후 식당가에서 먹습니다. 17:00쯤 시내에서 일찍 먹고 출발해도 됩니다.", q: "Sydney Airport International Terminal restaurants" }
      ],
      tip: "공항 기차 요금은 역 이용료가 포함돼 시내 요금보다 비쌉니다. 국제선은 출발 3시간 전 도착을 권장합니다. 면세 환급(TRS)은 AUD 300 이상 구매 시 공항에서 신청합니다." },

    { date: "2027-01-16", ph: "home", title: "인천 도착", stay: "귀국",
      lead: "06:35에 인천에 도착합니다. 수고하셨습니다.",
      spots: [{ n: "인천공항 도착", d: "입국 후 귀가.", q: "Incheon International Airport Terminal 2" }],
      lunch: [], dinner: [],
      tip: "" }
  ];

  var STAYS = [
    { name: "노보텔 시드니 인터내셔널 에어포트", dates: "12/29 – 12/30 (1박)", addr: "22 Levey St, Wolli Creek NSW 2205", cin: "14:00", cout: "11:00", ph: "+61 2 9518 2000", note: "현장 잔금 34.25 AUD", q: "Novotel Sydney International Airport", c: "air" },
    { name: "친척집", dates: "12/30 – 1/9 (10박)", addr: "10 Furber Rd, Centennial Park NSW 2021", cin: "", cout: "", ph: "", note: "", q: "10 Furber Rd, Centennial Park NSW 2021", c: "rel" },
    { name: "소피텔 시드니 달링하버", dates: "1/9 – 1/12 (3박)", addr: "12 Darling Dr, Sydney NSW 2000", cin: "15:00", cout: "11:00", ph: "+61 2 8388 8888", note: "현장 결제 720.80 AUD · 도착 전날 18:00까지 무료 취소", q: "Sofitel Sydney Darling Harbour", c: "city" },
    { name: "더 세벨 키웨스트 스위트 시드니", dates: "1/12 – 1/15 (3박)", addr: "98 Gloucester St, The Rocks NSW 2000", cin: "14:00", cout: "10:00", ph: "+61 2 9240 6000", note: "현장 결제 1,424 AUD · 도착 전날 18:00까지 무료 취소 · 하버 전망 객실", q: "The Sebel Quay West Suites Sydney", c: "city" }
  ];

  var FLIGHTS = [
    { dir: "인천 → 시드니", no: "KE 401 · B787-10 · 일반석", dep: "12/29(화) 08:00", arr: "12/29(화) 20:05" },
    { dir: "시드니 → 인천", no: "KE 402 · B787-10 · 일반석", dep: "1/15(금) 21:55", arr: "1/16(토) 06:35" }
  ];

  var INFO = [
    { h: "날씨와 자외선", p: ["12~1월은 한여름입니다. 낮 평균 25~30도, 가끔 35도를 넘는 날이 있습니다.", "자외선이 한국보다 훨씬 강합니다. SPF50+ 선크림, 모자, 선글라스, 물병이 기본입니다.", "갑자기 소나기가 올 수 있으니 얇은 우비를 챙기세요."] },
    { h: "교통", p: ["신용카드나 휴대폰 결제를 단말기에 대면 기차·버스·페리를 탈 수 있습니다(Opal 카드 대신). 가족 모두 같은 카드나 기기로 찍어야 일일 상한이 합산됩니다.", "윤이 연령에 따라 어린이 요금과 무료 구간이 있습니다. 어린이 Opal 카드가 필요한 경우가 있으니 역 창구에서 확인하세요.", "Uber를 쓸 때는 앱에서 어린이 카시트(Child Seat) 옵션을 요청하세요. 호주는 7세 미만 카시트가 의무입니다.", "공휴일(1/1)은 일요일 시간표로 운행합니다."] },
    { h: "해변 안전", p: ["반드시 빨간색·노란색 깃발 사이에서만 수영하세요. 깃발이 없는 곳은 들어가지 않습니다.", "이안류(바다로 끌려가는 물살)를 만나면 해변과 나란한 방향으로 헤엄쳐 빠져나옵니다.", "바위 위나 절벽 끝에서 사진을 찍지 마세요. 사고가 잦습니다."] },
    { h: "돈과 결제", p: ["통화는 호주 달러(AUD). 대부분 카드나 휴대폰 결제가 가능하고 현금은 거의 필요 없습니다.", "팁 문화가 없습니다. 식당 서비스에 만족하면 10% 정도 자유롭게 주면 됩니다.", "일부 가게는 공휴일에 10~15%의 할증(Surcharge)을 붙입니다."] },
    { h: "준비물과 규정", p: ["전압 230V, 콘센트는 Type I(비스듬한 날 3개). 한국용 멀티어댑터를 챙기세요.", "한국 여권은 전자여행허가(ETA)가 필요합니다. 앱으로 미리 신청되어 있는지 확인하세요.", "음식물, 과일, 씨앗류, 나무 제품은 입국 시 신고 대상입니다. 걸리면 벌금이 큽니다.", "여행자보험과 해외 데이터 로밍 또는 eSIM을 미리 준비하세요."] },
    { h: "비상 연락", p: ["긴급 상황(경찰·소방·구급): 000", "주시드니 대한민국 총영사관 영사콜센터(24시간): +82-2-3210-0404", "병원은 Medicare가 적용되지 않습니다. 보험 영수증을 꼭 받아 두세요."] }
  ];

  var MONTHS = { 12: "12월", 1: "1월" };
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  var view = document.getElementById("view");
  var state = { tab: "plan", day: 0, foodFilter: "all" };

  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function mapLink(q) { return q ? '<a class="map" href="' + G(q) + '" target="_blank" rel="noopener">지도</a>' : ""; }

  function items(list, cls) {
    if (!list.length) return '<p class="empty-note">없음</p>';
    return '<ul class="list">' + list.map(function (s) {
      return '<li class="item ' + (cls || "") + '"><div><b>' + esc(s.n) + '</b><span class="desc">' + esc(s.d) + '</span></div>' + mapLink(s.q) + '</li>';
    }).join("") + '</ul>';
  }

  function dayLabel(i) {
    var d = parse(DAYS[i].date);
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WD[d.getDay()] + ")";
  }

  function renderPlan() {
    var todayStr = ymd(new Date());
    var strip = DAYS.map(function (day, i) {
      var d = parse(day.date);
      var first = d.getDate() === 1 || i === 0;
      return '<button class="chip' + (day.date === todayStr ? " today" : "") + '" style="--c:' + PHASE[day.ph].color + '" data-i="' + i + '" aria-pressed="' + (i === state.day) + '" aria-label="' + dayLabel(i) + '">' +
        '<span class="m">' + (first ? MONTHS[d.getMonth() + 1] : "&nbsp;") + '</span><span class="d">' + d.getDate() + '</span><span class="w">' + WD[d.getDay()] + '</span></button>';
    }).join("");

    var legend = '<div class="legend">' + Object.keys(PHASE).map(function (k) { return '<span><i style="background:' + PHASE[k].color + '"></i>' + PHASE[k].label + '</span>'; }).join("") + '</div>';

    var day = DAYS[state.day];
    var ph = PHASE[day.ph];
    var badges = '<span class="badge ' + ph.cls + '">' + esc(day.stay) + '</span>' + (day.withRel ? '<span class="badge rel">친척 차량 추천</span>' : "");
    var html = '<div class="strip" id="strip">' + strip + '</div>' + legend +
      '<article class="day"><div class="day-head"><div class="badges">' + badges + '</div>' +
      '<div class="date-line">' + dayLabel(state.day) + ' · ' + (state.day + 1) + '/' + DAYS.length + '일째</div>' +
      '<h2>' + esc(day.title) + '</h2><p class="lead">' + esc(day.lead) + '</p></div>' +
      '<section class="block"><h3 class="label">가볼 곳</h3>' + items(day.spots) + '</section>';
    if (day.lunch.length) html += '<section class="block"><h3 class="label">점심</h3>' + items(day.lunch, "meal") + '</section>';
    if (day.dinner.length) html += '<section class="block"><h3 class="label">저녁</h3>' + items(day.dinner, "meal") + '</section>';
    if (day.tip) html += '<div class="tipbox"><b>알아둘 것</b><br>' + esc(day.tip) + '</div>';
    html += '<div class="pager"><button id="prev"' + (state.day === 0 ? " disabled" : "") + '>← 전날</button><button id="next"' + (state.day === DAYS.length - 1 ? " disabled" : "") + '>다음날 →</button></div></article>' +
      '<p class="fine">영업시간·휴무·예약 여부는 방문 전에 지도 앱에서 한 번 더 확인하세요.</p>';
    view.innerHTML = html;

    var chips = view.querySelectorAll(".chip");
    chips.forEach(function (c) { c.addEventListener("click", function () { selectDay(+c.dataset.i); }); });
    var sel = view.querySelector('.chip[aria-pressed="true"]');
    if (sel) { var st = document.getElementById("strip"); st.scrollLeft = sel.offsetLeft - st.clientWidth / 2 + sel.clientWidth / 2; }
    document.getElementById("prev").addEventListener("click", function () { selectDay(state.day - 1, true); });
    document.getElementById("next").addEventListener("click", function () { selectDay(state.day + 1, true); });
  }

  function selectDay(i, scrollTop) {
    if (i < 0 || i >= DAYS.length) return;
    state.day = i; save("sydney.day", String(i));
    renderPlan();
    if (scrollTop) window.scrollTo({ top: 0, behavior: "auto" });
  }

  function copyBtn(text) { return '<button class="copy" data-copy="' + esc(text) + '">복사</button>'; }

  function renderStay() {
    var h = '<div class="stack"><h2 style="font-size:20px">항공</h2>';
    FLIGHTS.forEach(function (f) {
      h += '<div class="card"><h3>' + f.dir + '</h3><dl class="kv"><dt>편명</dt><dd>' + f.no + '</dd><dt>출발</dt><dd>' + f.dep + '</dd><dt>도착</dt><dd>' + f.arr + '</dd></dl></div>';
    });
    h += '<p class="fine" style="margin-top:0">2026년 7월 대한항공 스케줄 변경이 반영된 시간입니다. 출발 전 앱에서 한 번 더 확인하세요.</p>';
    h += '<h2 style="font-size:20px;margin-top:8px">숙소</h2>';
    STAYS.forEach(function (s) {
      h += '<div class="card"><div class="badges"><span class="badge ' + PHASE[s.c].cls + '">' + s.dates + '</span></div><h3>' + esc(s.name) + '</h3><dl class="kv">' +
        '<dt>주소</dt><dd>' + esc(s.addr) + copyBtn(s.addr) + '</dd>' +
        (s.cin ? '<dt>체크인</dt><dd>' + s.cin + '</dd><dt>체크아웃</dt><dd>' + s.cout + '</dd>' : "") +
        (s.ph ? '<dt>전화</dt><dd>' + s.ph + '</dd>' : "") +
        (s.note ? '<dt>메모</dt><dd>' + esc(s.note) + '</dd>' : "") +
        '</dl><div><a class="map" href="' + G(s.q) + '" target="_blank" rel="noopener">지도에서 보기</a></div></div>';
    });
    h += '</div>';
    view.innerHTML = h;
    bindCopy();
  }

  function bindCopy() {
    view.querySelectorAll(".copy").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = b.dataset.copy;
        var done = function () { b.textContent = "복사됨"; setTimeout(function () { b.textContent = "복사"; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { b.textContent = "길게 눌러 복사"; });
        else b.textContent = "길게 눌러 복사";
      });
    });
  }

  function renderFood() {
    var f = state.foodFilter;
    var seg = [["all", "전체"], ["rel", "친척집 기간"], ["city", "시내 기간"]].map(function (x) {
      return '<button data-f="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>';
    }).join("");
    var h = '<div class="seg" id="seg">' + seg + '</div><div class="stack">';
    DAYS.forEach(function (day, i) {
      if (f === "rel" && day.ph !== "rel") return;
      if (f === "city" && day.ph !== "city" && day.ph !== "home" && day.ph !== "air") return;
      var all = day.lunch.map(function (m) { return { m: m, t: "점심" }; }).concat(day.dinner.map(function (m) { return { m: m, t: "저녁" }; }))
        .filter(function (x) { return x.m.q; });
      if (!all.length) return;
      h += '<div class="card"><div class="date-line"><button class="copy" data-day="' + i + '" style="margin:0">' + dayLabel(i) + ' · ' + esc(day.title) + '</button></div><ul class="list">' +
        all.map(function (x) { return '<li class="item meal"><div><b>' + esc(x.m.n) + '</b><span class="desc">' + x.t + ' · ' + esc(x.m.d) + '</span></div>' + mapLink(x.m.q) + '</li>'; }).join("") + '</ul></div>';
    });
    h += '</div><p class="fine">날짜 버튼을 누르면 그날 일정으로 이동합니다. 영업시간과 예약은 방문 전에 확인하세요.</p>';
    view.innerHTML = h;
    view.querySelectorAll("#seg button").forEach(function (b) { b.addEventListener("click", function () { state.foodFilter = b.dataset.f; renderFood(); }); });
    view.querySelectorAll("[data-day]").forEach(function (b) { b.addEventListener("click", function () { state.day = +b.dataset.day; save("sydney.day", String(state.day)); setTab("plan"); window.scrollTo(0, 0); }); });
  }

  function renderInfo() {
    var h = '<div class="stack">' + INFO.map(function (s) {
      return '<div class="card"><h3>' + esc(s.h) + '</h3>' + s.p.map(function (p) { return '<p style="margin:4px 0">' + esc(p) + '</p>'; }).join("") + '</div>';
    }).join("") + '</div>';
    view.innerHTML = h;
  }

  function setTab(t) {
    state.tab = t; save("sydney.tab", t);
    document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === t)); });
    if (t === "plan") renderPlan(); else if (t === "stay") renderStay(); else if (t === "food") renderFood(); else renderInfo();
  }

  document.querySelectorAll("#tabs button").forEach(function (b) { b.addEventListener("click", function () { setTab(b.dataset.tab); window.scrollTo(0, 0); }); });

  /* 시작: 오늘이 여행 기간이면 오늘 날짜, 아니면 마지막에 보던 날 */
  var idx = -1, today = ymd(new Date());
  DAYS.forEach(function (d, i) { if (d.date === today) idx = i; });
  if (idx < 0) { var s = parseInt(load("sydney.day"), 10); idx = (s >= 0 && s < DAYS.length) ? s : 0; }
  state.day = idx;
  var t0 = load("sydney.tab");
  setTab(["plan", "stay", "food", "info"].indexOf(t0) >= 0 ? t0 : "plan");
})();
</script>
</body>
</html>
